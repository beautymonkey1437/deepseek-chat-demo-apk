<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>API 使用 demo</title><meta content="0.1.3" name="application-version"><script>
(function(){
  try{
    if(!Array.prototype.toSorted)Array.prototype.toSorted=function(c){return this.slice().sort(c);};
    if(!Array.prototype.toReversed)Array.prototype.toReversed=function(){return this.slice().reverse();};
    if(!Array.prototype.toSpliced)Array.prototype.toSpliced=function(){var a=this.slice();return a.splice.apply(a,arguments),a;};
    if(!Array.prototype.with)Array.prototype.with=function(i,v){var a=this.slice();a[i<0?a.length+i:i]=v;return a;};
    if(!Array.prototype.at)Array.prototype.at=function(i){i=i||0;return i<0?this[this.length+i]:this[i];};
    if(!Array.prototype.findLast)Array.prototype.findLast=function(f){for(var i=this.length-1;i>=0;i--)if(f(this[i],i,this))return this[i];};
    if(!Array.prototype.findLastIndex)Array.prototype.findLastIndex=function(f){for(var i=this.length-1;i>=0;i--)if(f(this[i],i,this))return i;return -1;};
    if(!Object.hasOwn)Object.hasOwn=function(o,k){return Object.prototype.hasOwnProperty.call(o,k);};
    if(!Object.groupBy)Object.groupBy=function(a,f){var o=Object.create(null);a.forEach(function(x){var k=f(x);(o[k]||(o[k]=[])).push(x);});return o;};
    if(typeof CSS==='undefined')window.CSS={};
    if(!CSS.escape)CSS.escape=function(s){return String(s).replace(/([^a-zA-Z0-9_-])/g,'\\$1');};
  }catch(e){}
  try{
    var s=document.createElement('style');
    s.textContent=':root{--app-viewport-height:100vh!important;--app-viewport-top:0px!important}html,body{height:100%!important;margin:0!important}#root{height:100vh!important;min-height:100vh!important}#root>div{height:100vh!important;min-height:100vh!important}[class*=frame-]{height:100vh!important}';
    (document.head||document.documentElement).appendChild(s);
  }catch(e){}
})();
</script>
<script>
(function(){
  if(window.__dsUploadBridge) return;
  window.__dsUploadBridge = true;
  function log(s){ try{ if(window.DSNative && window.DSNative.log) window.DSNative.log('[upl] '+s); }catch(e){} }
  var nativeFetch = window.fetch;
  if(!nativeFetch) return;

  function toB64(blob){
    return new Promise(function(resolve,reject){
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var s = String(fr.result);
          var comma = s.indexOf(',');
          resolve(comma>=0 ? s.substring(comma+1) : s);
        }catch(e){ reject(e); }
      };
      fr.onerror = function(){ reject(new Error('read file failed')); };
      try{ fr.readAsDataURL(blob); }catch(e){ reject(e); }
    });
  }

  // 把原生返回的 JSON 字符串包装成 fetch Response 风格对象
  function wrapResponse(jsonText, ok, status){
    return {
      ok: ok,
      status: status || (ok?200:400),
      statusText: ok?'OK':'Bad Request',
      json: function(){ return Promise.resolve(JSON.parse(jsonText)); },
      text: function(){ return Promise.resolve(jsonText); }
    };
  }

  window.fetch = function(input, init){
    var url = (typeof input==='string') ? input : (input && input.url) || '';
    var opt = init || {};
    try{
      if(url.indexOf('/anthropic/v1/files')>=0 && opt.body && (typeof FormData!=='undefined') && (opt.body instanceof FormData) && window.DSNative && window.DSNative.uploadFile){
        log('intercept file upload to '+url);
        var fd = opt.body;
        var headers = opt.headers || {};
        // headers 可能是普通对象或 Headers
        var apiKey = '';
        try{
          if(headers.get) apiKey = headers.get('x-api-key') || '';
          else { for(var k in headers){ if(String(k).toLowerCase()==='x-api-key'){ apiKey=headers[k]; break; } } }
        }catch(e){}
        var file = fd.get ? fd.get('file') : null;
        var purpose = fd.get ? fd.get('purpose') : null;
        var name = (file && file.name) || 'file';
        var type = (file && file.type) || 'application/octet-stream';
        var size = file && file.size || 0;
        log('key='+(apiKey?apiKey.slice(0,6)+'...':'none')+' file='+name+' type='+type+' size='+size+' purpose='+purpose);
        return toB64(file).then(function(b64){
          log('b64 len='+b64.length);
          return new Promise(function(resolve,reject){
            // 原生通过 DSUploadDone(id, json, ok) 回调
            var id = 'up_'+(Date.now())+'_'+Math.random().toString(36).slice(2);
            window.__dsUploadCbs = window.__dsUploadCbs || {};
            window.__dsUploadCbs[id] = function(json, ok){
              log('native done ok='+ok+' json='+String(json).slice(0,120));
              try{ resolve(wrapResponse(json, ok!==false, ok===false?400:200)); }
              catch(e){ reject(e); }
            };
            try{ window.DSNative.uploadFile(id, apiKey, b64, name, type, purpose||''); }
            catch(e){ reject(e); }
          });
        }).catch(function(e){ log('ERR '+e.message); throw e; });
      }
    }catch(e){ log('detect ERR '+e.message); }
    return nativeFetch.apply(this, arguments);
  };

  // 原生回调入口
  window.DSUploadDone = function(id, json, ok){
    try{
      var cb = window.__dsUploadCbs && window.__dsUploadCbs[id];
      if(cb){ delete window.__dsUploadCbs[id]; cb(json, ok); }
    }catch(e){}
  };
  log('bridge installed');
})();

</script>
